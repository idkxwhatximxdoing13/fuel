<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel</title>
<meta name="theme-color" content="#0a0806">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preload" href="fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="in">
  <svg class="mark" viewBox="0 0 120 34" aria-label="Fuel">
    <text x="2" y="28" font-family="VT323, monospace" font-size="36" font-style="italic" letter-spacing="3" fill="rgba(242,163,58,.08)" stroke="#f2a33a" stroke-width="1.1" textLength="104" lengthAdjust="spacingAndGlyphs" transform="skewX(-12)">FUEL</text>
  </svg>
  <div class="pill" id="pill"><span class="led warn" id="led"></span><span id="pillTxt">BOOTING</span></div>
</div></header>

<main id="app">
  <!-- TODAY -->
  <section id="tab-today" class="tab active">
    <header class="dayhead">
      <button class="icon" id="dayPrev" aria-label="Previous day">‹</button>
      <h1 id="dayTitle">Today</h1>
      <button class="icon" id="dayNext" aria-label="Next day">›</button>
    </header>
    <div class="week" id="weekStrip"></div>
    <div class="card summary">
      <div class="kcalrow">
        <div>
          <div class="big" id="kcalLeft">–</div>
          <div id="kcalLeftLabel">kcal left</div>
        </div>
        <div class="right muted" id="kcalEaten"></div>
      </div>
      <div class="bar"><div id="kcalBar"></div></div>
      <div class="macros">
        <div class="macro"><span>Protein</span><b id="mP">0</b><div class="bar thin"><div id="bP" class="p"></div></div></div>
        <div class="macro"><span>Carbs</span><b id="mC">0</b><div class="bar thin"><div id="bC" class="c"></div></div></div>
        <div class="macro"><span>Fat</span><b id="mF">0</b><div class="bar thin"><div id="bF" class="f"></div></div></div>
      </div>
    </div>
    <div class="addrow">
      <button class="primary" data-act="scan"><span class="g">▦</span>Scan</button>
      <button data-act="search"><span class="g">⌕</span>Foods</button>
      <button data-act="describe"><span class="g">✎</span>Describe</button>
      <button data-act="quick"><span class="g">＋</span>Quick</button>
    </div>
    <div class="quick" id="quickStrip"></div>
    <div id="meals"></div>
    <div class="card water" id="waterCard"></div>
    <div id="setupHint" class="card hint hidden"><b>No targets yet.</b> <button class="link" data-goto="me">Set up your profile →</button></div>
  </section>

  <!-- PROGRESS -->
  <section id="tab-weight" class="tab">
    <h1>Progress</h1>
    <div class="card">
      <div class="row">
        <input id="wInput" type="number" inputmode="decimal" step="0.1" placeholder="kg">
        <input id="wDate" type="date" style="flex:1.6">
        <button class="primary" id="wSave">Save</button>
      </div>
    </div>
    <div class="card" id="wHead"></div>
    <div class="card"><div class="ph"><h3>Weight</h3><small id="wLegend"></small></div><div id="wChart"></div><div id="wStats" class="small"></div></div>
    <div class="card" id="weekCard"></div>
    <div class="card" id="medalCard"></div>
    <div class="card" id="adaptCard"></div>
    <div class="card"><details><summary>Weigh-in history</summary><ul id="wList" class="list"></ul></details></div>
  </section>

  <!-- ME / SETTINGS -->
  <section id="tab-me" class="tab">
    <h1>Me</h1>
    <div class="card" id="targetsCard"></div>
    <form id="profileForm" class="card form">
      <h3>Profile</h3>
      <div class="grid2">
        <label>Sex <select name="sex"><option value="m">Male</option><option value="f">Female</option></select></label>
        <label>Birth year <input name="birthYear" type="number" inputmode="numeric" placeholder="1997"></label>
        <label>Height cm <input name="height" type="number" inputmode="decimal" placeholder="180"></label>
        <label>Goal weight kg <input name="goalKg" type="number" inputmode="decimal" step="0.1" placeholder="optional"></label>
      </div>
      <label>Activity
        <select name="activity">
          <option value="1.2">Mostly sitting, no training</option>
          <option value="1.375">Light: training 1–3×/week</option>
          <option value="1.55">Moderate: training 3–5×/week</option>
          <option value="1.725">High: hard training 6–7×/week</option>
          <option value="1.9">Very high: physical job + training</option>
        </select>
      </label>
      <label>Goal
        <select name="goal">
          <option value="auto">Not sure – suggest one</option>
          <option value="lose">Lose fat</option>
          <option value="recomp">Recomp (lose fat + build muscle)</option>
          <option value="gain">Build muscle</option>
        </select>
      </label>
      <div class="grid2">
        <label>Calories override <input name="kcalOverride" type="number" inputmode="numeric" placeholder="auto"></label>
        <label>Water goal ml <input name="waterGoal" type="number" inputmode="numeric" placeholder="2500"></label>
      </div>
      <button class="primary wide" type="submit">Save profile</button>
    </form>
    <form id="aiForm" class="card form">
      <h3>AI · label photos, plate photos, describe</h3>
      <label>Anthropic API key <input name="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
      <label>Model
        <select name="model">
          <option value="claude-opus-5-5">Opus 5.5 · best</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5 · cheaper</option>
          <option value="claude-haiku-5-5">Haiku 5.5 · cheapest</option>
        </select>
      </label>
      <div class="btnrow"><button class="primary" type="submit">Save</button><button type="button" id="aiTest">Test key</button></div>
      <p class="muted small" style="margin:8px 0 0">Stored only on this phone.</p>
    </form>
    <div class="card form">
      <h3>Backup</h3>
      <div class="btnrow"><button id="exportBtn">Export</button><label class="filebtn" style="flex:1">Import<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>
      <p class="muted small" id="storageInfo" style="margin:8px 0 0"></p>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="today" class="active">Today</button>
  <button data-tab="weight">Progress</button>
  <button data-tab="me">Me</button>
</nav>

<dialog id="sheet"><div id="sheetBody"></div></dialog>
<div id="toast" class="toast hidden" popover="manual"></div>

<script src="vendor.js"></script>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
