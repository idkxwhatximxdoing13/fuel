<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Fuel</title>
<meta name="theme-color" content="#0b0907">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preload" href="fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <!-- TODAY -->
  <section id="tab-today" class="tab active">
    <div class="top">
      <div><h1 id="dayTitle">Today</h1><div class="sub" id="daySub"></div></div>
      <div class="streak" id="streak"><span class="led"></span><span id="streakTxt"></span></div>
    </div>
    <div class="days" id="weekStrip"></div>
    <div class="card hero">
      <div class="ring" id="ring"></div>
      <div class="pair" id="pair"></div>
      <div class="macros">
        <div class="macro"><div class="top2"><span class="lbl">Protein</span></div><b id="mP">0</b><div class="bar"><div id="bP" class="p"></div></div></div>
        <div class="macro"><div class="top2"><span class="lbl">Carbs</span></div><b id="mC">0</b><div class="bar"><div id="bC" class="c"></div></div></div>
        <div class="macro"><div class="top2"><span class="lbl">Fat</span></div><b id="mF">0</b><div class="bar"><div id="bF" class="f"></div></div></div>
      </div>
    </div>
    <div id="setupHint" class="card hidden" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span class="muted">Set up your profile to get targets.</span><button class="primary" data-goto="me">Set up</button></div>
    <div id="meals"></div>
    <div class="card water" id="waterCard"></div>
  </section>

  <!-- PROGRESS -->
  <section id="tab-weight" class="tab">
    <div class="top"><div><h1>Progress</h1><div class="sub">weight · week · medals</div></div></div>
    <div class="card" id="wHead"></div>
    <div class="card">
      <h3>Log weight</h3>
      <div class="wrow">
        <input id="wInput" type="number" inputmode="decimal" step="0.1" placeholder="kg">
        <input id="wDate" type="date">
      </div>
      <button class="primary wide" id="wSave" style="margin-top:10px">Save weigh-in</button>
    </div>
    <div class="card"><div class="sec"><h3>Trend</h3><small id="wLegend"></small></div><div id="wChart"></div></div>
    <div class="card" id="weekCard"></div>
    <div class="card" id="medalCard"></div>
    <div class="card" id="adaptCard"></div>
    <div class="card"><details><summary>Weigh-in history</summary><ul id="wList" class="list" style="margin-top:8px"></ul></details></div>
  </section>

  <!-- ME -->
  <section id="tab-me" class="tab">
    <div class="top"><div><h1>Me</h1><div class="sub">targets · profile · settings</div></div></div>
    <div class="card" id="targetsCard"></div>
    <form id="profileForm" class="card form">
      <h3>Profile</h3>
      <div class="grid2">
        <label>Sex <select name="sex"><option value="m">Male</option><option value="f">Female</option></select></label>
        <label>Birth year <input name="birthYear" type="number" inputmode="numeric" placeholder="1997"></label>
        <label>Height cm <input name="height" type="number" inputmode="decimal" placeholder="180"></label>
        <label>Goal weight <input name="goalKg" type="number" inputmode="decimal" step="0.1" placeholder="kg"></label>
      </div>
      <label>Activity
        <select name="activity">
          <option value="1.2">Mostly sitting, no training</option>
          <option value="1.375">Light · training 1–3×/week</option>
          <option value="1.55">Moderate · training 3–5×/week</option>
          <option value="1.725">High · hard training 6–7×/week</option>
          <option value="1.9">Very high · physical job + training</option>
        </select>
      </label>
      <label>Goal
        <select name="goal">
          <option value="auto">Not sure · suggest one</option>
          <option value="lose">Lose fat</option>
          <option value="recomp">Recomp · lose fat, build muscle</option>
          <option value="gain">Build muscle</option>
        </select>
      </label>
      <div class="grid2">
        <label>Calories <input name="kcalOverride" type="number" inputmode="numeric" placeholder="auto"></label>
        <label>Water ml <input name="waterGoal" type="number" inputmode="numeric" placeholder="2500"></label>
      </div>
      <button class="primary wide" type="submit">Save profile</button>
    </form>
    <form id="aiForm" class="card form">
      <h3>AI</h3>
      <label>Anthropic API key <input name="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
      <label>Model
        <select name="model">
          <option value="claude-opus-5-5">Opus 5.5 · best</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5 · cheaper</option>
          <option value="claude-haiku-5-5">Haiku 5.5 · cheapest</option>
        </select>
      </label>
      <div class="btnrow"><button class="primary" type="submit">Save</button><button type="button" id="aiTest">Test key</button></div>
    </form>
    <div class="card">
      <h3>Backup</h3>
      <div class="btnrow" style="margin-top:0"><button id="exportBtn">Export</button><label class="filebtn">Import<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>
      <p class="muted small" id="storageInfo" style="margin:10px 0 0"></p>
    </div>
  </section>
</main>

<button class="primary fab show" id="fab" aria-label="Add food">+</button>

<nav class="tabbar">
  <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/><circle cx="12" cy="12" r="2"/></svg>Today</button>
  <button data-tab="weight"><svg viewBox="0 0 24 24"><path d="M3.5 17l5-5.5 4 3.5 7.5-8"/><path d="M15 7h5v5"/></svg>Progress</button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.4-3.6 4.2-5.2 7.5-5.2s6.1 1.6 7.5 5.2"/></svg>Me</button>
</nav>

<dialog id="sheet"><div id="sheetBody"></div></dialog>
<div id="toast" class="toast hidden" popover="manual"></div>

<script src="vendor.js"></script>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
